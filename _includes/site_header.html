<header class="site-header">
  <nav class="site-nav" aria-label="Primary">
    <span class="site-nav-group">
      <a href="/"{% if include.current == "recommendations" %} aria-current="page"{% endif %}>Recommendations</a>
      <a href="/about/"{% if include.current == "about" %} aria-current="page"{% endif %}>About</a>
    </span>
    <span class="site-nav-group site-nav-profiles">
      {% for profile in site.data.resume.basics.profiles %}
      <a href="{{ profile.url | escape }}" target="_blank" rel="noopener">{{ profile.network | escape }}<svg class="external-link-icon" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4.5 2H2.75A1.75 1.75 0 0 0 1 3.75v5.5C1 10.22 1.78 11 2.75 11h5.5C9.22 11 10 10.22 10 9.25V7.5M7 1h4v4M11 1 5.5 6.5"/></svg><span class="visually-hidden"> (opens in a new window)</span></a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme"><span class="theme-toggle-icon" aria-hidden="true"></span></button>
    </span>
  </nav>
</header>
<script>
(() => {
  const root = document.documentElement;
  const button = document.querySelector('.theme-toggle');
  const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
  if (!button) return;

  const currentTheme = () => root.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
  const updateLabel = () => {
    const nextTheme = currentTheme() === 'dark' ? 'light' : 'dark';
    const label = `Use ${nextTheme} theme`;
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
  };

  button.addEventListener('click', () => {
    const nextTheme = currentTheme() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = nextTheme;
    try { localStorage.setItem('color-theme', nextTheme); } catch (_) {}
    updateLabel();
  });

  systemTheme.addEventListener?.('change', () => {
    if (!root.dataset.theme) updateLabel();
  });
  updateLabel();
})();
</script>
