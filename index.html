<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stanislav Natalenko</title>
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #666;
    --accent: #2a5d8f;
    --rule: #e5e5e5;
    --bg: #fff;
    --maxw: 780px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 48px 24px;
  }
  main { max-width: var(--maxw); margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 36px 0 14px; padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
  }
  h3 { font-size: 16px; font-weight: 600; margin: 0; }
  h4 { font-size: 15px; font-weight: 600; margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  p { margin: 4px 0; }
  ul { margin: 6px 0 0; padding-left: 20px; }
  li { margin: 3px 0; }

  .header { display: flex; align-items: center; gap: 20px; margin-bottom: 4px; }
  .header .header-text { flex: 1; min-width: 0; }
  .header h1 { margin-bottom: 4px; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%; flex-shrink: 0;
    object-fit: cover; background: var(--rule);
  }
  .label { color: var(--muted); margin: 0 0 10px; }
  .summary { margin: 18px 0 0; font-size: 15px; line-height: 1.6; }
  .contact { font-size: 14px; color: var(--muted); }
  .contact a { color: var(--muted); }
  .contact span + span::before { content: " · "; color: var(--rule); margin: 0 4px; }

  .entry { margin: 0 0 18px; }
  .entry:last-child { margin-bottom: 0; }
  .entry-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    flex-wrap: wrap;
  }
  .entry-meta { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .entry-sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  .entry-desc { margin-top: 6px; font-size: 14px; }
  .entry-tags {
    margin-top: 6px; font-size: 12px; color: var(--muted);
  }
  .entry-tags span { display: inline-block; margin-right: 6px; }

  .position { margin: 10px 0 0; padding-left: 14px; border-left: 2px solid var(--rule); }
  .position:first-of-type { margin-top: 8px; }
  .position ul, .position li { font-size: 14px; }

  .toggle {
    display: inline-block; margin-top: 12px; padding: 0; border: 0; background: none;
    color: var(--accent); font: inherit; font-size: 14px; cursor: pointer;
  }
  .toggle:hover { text-decoration: underline; }
  .hidden { display: none; }
  @media print { .toggle { display: none; } .hidden { display: block !important; } }

  blockquote {
    margin: 6px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--rule);
    color: #333; font-size: 14px; white-space: pre-line;
  }

  @media print {
    body { padding: 0; font-size: 11pt; }
    h2 { margin-top: 18px; }
    a { color: inherit; }
  }
</style>
</head>
<body>
<main id="root">Loading…</main>
<script>
(async () => {
  const root = document.getElementById('root');
  let data;
  try {
    const res = await fetch('stanislav_natalenko.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.statusText);
    data = await res.json();
  } catch (e) {
    root.textContent = 'Failed to load stanislav_natalenko.json: ' + e.message;
    return;
  }

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtDate = (s) => {
    if (!s) return '';
    const [y, m] = s.split('-');
    return m ? `${MONTHS[parseInt(m, 10) - 1]} ${y}` : y;
  };
  const range = (start, end) => {
    const s = fmtDate(start), e = end ? fmtDate(end) : (start ? 'Present' : '');
    return s && e ? `${s} – ${e}` : s || e;
  };
  const duration = (start, end) => {
    if (!start) return '';
    const [sy, sm = '1'] = start.split('-');
    const now = new Date();
    const [ey, em] = end ? end.split('-') : [String(now.getFullYear()), String(now.getMonth() + 1)];
    const total = (parseInt(ey, 10) - parseInt(sy, 10)) * 12 + (parseInt(em, 10) - parseInt(sm, 10));
    if (total < 0) return '';
    if (total < 18) return `${total} ${total === 1 ? 'mo' : 'mos'}`;
    const yrs = Math.round((total / 12) * 10) / 10;
    const label = Number.isInteger(yrs) ? String(yrs) : yrs.toFixed(1);
    return `${label} ${yrs === 1 ? 'yr' : 'yrs'}`;
  };
  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null) continue;
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else node.setAttribute(k, v);
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  };
  const link = (href, text) => el('a', { href, target: '_blank', rel: 'noopener' }, text);

  if(data.basics?.name)
  	document.title = data.basics.name;
  root.innerHTML = '';

  // Header
  if (data.basics) {
    const b = data.basics;
    const text = el('div', { class: 'header-text' });
    text.appendChild(el('h1', {}, b.name || ''));
    if (b.label) text.appendChild(el('p', { class: 'label' }, b.label));
    const contact = el('p', { class: 'contact' });
    if (b.url) contact.appendChild(el('span', {}, link(b.url, b.url.replace(/^https?:\/\//, ''))));
    (b.profiles || []).forEach(p => {
      contact.appendChild(el('span', {}, link(p.url, `${p.network}: ${p.username}`)));
    });
    if (contact.children.length) text.appendChild(contact);

    const header = el('div', { class: 'header' });
    const avatar = el('img', {
      class: 'avatar',
      src: 'https://www.gravatar.com/avatar/94ce00f9b879e3e256d0dbfce343ed9b?s=200&d=mp',
      alt: b.name || ''
    });
    header.appendChild(avatar);
    header.appendChild(text);
    root.appendChild(header);

    if (b.summary) root.appendChild(el('p', { class: 'summary' }, b.summary));
  }

  const section = (title, items, render) => {
    if (!items || !items.length) return;
    root.appendChild(el('h2', {}, title));
    items.forEach(item => root.appendChild(render(item)));
  };

  // Projects — first 3 visible, rest behind toggle
  if (data.projects?.length) {
    root.appendChild(el('h2', {}, 'Projects'));
    const VISIBLE = 3;
    const renderProject = (p) => {
      const head = el('div', { class: 'entry-head' },
        el('h3', {}, p.url ? link(p.url, p.name) : p.name),
        el('div', { class: 'entry-meta' }, range(p.startDate, p.endDate))
      );
      const subParts = [p.entity, p.roles?.join(', '), p.type].filter(Boolean);
      const entry = el('div', { class: 'entry' }, head);
      if (subParts.length) entry.appendChild(el('p', { class: 'entry-sub' }, subParts.join(' · ')));
      if (p.description) entry.appendChild(el('p', { class: 'entry-desc' }, p.description));
      if (p.keywords?.length) {
        entry.appendChild(el('p', { class: 'entry-tags' }, p.keywords.join(' · ')));
      }
      return entry;
    };
    data.projects.slice(0, VISIBLE).forEach(p => root.appendChild(renderProject(p)));
    const rest = data.projects.slice(VISIBLE);
    if (rest.length) {
      const more = el('div', { class: 'hidden' });
      rest.forEach(p => more.appendChild(renderProject(p)));
      const btn = el('button', { class: 'toggle', type: 'button' }, `View ${rest.length} more`);
      btn.addEventListener('click', () => {
        const collapsed = more.classList.toggle('hidden');
        btn.textContent = collapsed ? `View ${rest.length} more` : 'View less';
      });
      root.appendChild(btn);
      root.appendChild(more);
    }
  }

  // Experience — grouped by company
  if (data.work?.length) {
    root.appendChild(el('h2', {}, 'Experience'));
    const groups = [];
    for (const w of data.work) {
      const last = groups[groups.length - 1];
      if (last && last.name === w.name) last.items.push(w);
      else groups.push({ name: w.name, url: w.url, items: [w] });
    }
    const subLine = (w, url) => {
      const parts = [];
      if (url) parts.push(link(url, url.replace(/^https?:\/\//, '').replace(/\/$/, '')));
      if (w.description) parts.push(document.createTextNode(w.description));
      if (w.location) parts.push(document.createTextNode(w.location));
      if (!parts.length) return null;
      const p = el('p', { class: 'entry-sub' });
      parts.forEach((node, i) => {
        if (i > 0) p.appendChild(document.createTextNode(' · '));
        p.appendChild(node);
      });
      return p;
    };

    for (const g of groups) {
      const first = g.items[0];                       // most recent role
      const last = g.items[g.items.length - 1];       // earliest role

      if (g.items.length === 1) {
        const w = first;
        const dur = duration(w.startDate, w.endDate);
        const meta = dur ? `${range(w.startDate, w.endDate)} · ${dur}` : range(w.startDate, w.endDate);
        const title = [g.name, w.position].filter(Boolean).join(' - ');
        const head = el('div', { class: 'entry-head' },
          el('h3', {}, title),
          el('div', { class: 'entry-meta' }, meta)
        );
        const entry = el('div', { class: 'entry' }, head);
        const sub = subLine(w, g.url);
        if (sub) entry.appendChild(sub);
        if (w.summary) entry.appendChild(el('p', { class: 'entry-desc' }, w.summary));
        if (w.highlights?.length) {
          entry.appendChild(el('ul', {}, w.highlights.map(h => el('li', {}, h))));
        }
        root.appendChild(entry);
        continue;
      }

      const compRange = range(last.startDate, first.endDate);
      const compDur = duration(last.startDate, first.endDate);
      const meta = compDur ? `${compRange} · ${compDur}` : compRange;
      const head = el('div', { class: 'entry-head' },
        el('h3', {}, g.name || ''),
        el('div', { class: 'entry-meta' }, meta)
      );
      const entry = el('div', { class: 'entry' }, head);
      const sub = subLine(first, g.url);
      if (sub) entry.appendChild(sub);

      for (const w of g.items) {
        const pHead = el('div', { class: 'entry-head' },
          el('h4', {}, w.position || ''),
          el('div', { class: 'entry-meta' }, range(w.startDate, w.endDate))
        );
        const pos = el('div', { class: 'position' }, pHead);
        if (w.summary) pos.appendChild(el('p', { class: 'entry-desc' }, w.summary));
        if (w.highlights?.length) {
          pos.appendChild(el('ul', {}, w.highlights.map(h => el('li', {}, h))));
        }
        entry.appendChild(pos);
      }
      root.appendChild(entry);
    }
  }

  // Education
  section('Education', data.education, e => {
    const title = [e.studyType, e.area].filter(Boolean).join(' in ') || e.institution;
    const head = el('div', { class: 'entry-head' },
      el('h3', {}, title),
      el('div', { class: 'entry-meta' }, range(e.startDate, e.endDate))
    );
    const entry = el('div', { class: 'entry' }, head);
    if (e.institution && title !== e.institution) {
      entry.appendChild(el('p', { class: 'entry-sub' }, e.institution));
    }
    if (e.score) entry.appendChild(el('p', { class: 'entry-desc' }, e.score));
    if (e.courses?.length) {
      entry.appendChild(el('ul', {}, e.courses.map(c => el('li', {}, c))));
    }
    return entry;
  });

  // Publications
  section('Patents & Publications', data.publications, p => {
    const head = el('div', { class: 'entry-head' },
      el('h3', {}, p.url ? link(p.url, p.name) : p.name),
      el('div', { class: 'entry-meta' }, fmtDate(p.releaseDate))
    );
    const entry = el('div', { class: 'entry' }, head);
    if (p.publisher) entry.appendChild(el('p', { class: 'entry-sub' }, p.publisher));
    if (p.summary) entry.appendChild(el('p', { class: 'entry-desc' }, p.summary));
    return entry;
  });

  // Awards
  section('Honors & Awards', data.awards, a => {
    const head = el('div', { class: 'entry-head' },
      el('h3', {}, a.title),
      el('div', { class: 'entry-meta' }, fmtDate(a.date))
    );
    const entry = el('div', { class: 'entry' }, head);
    if (a.awarder) entry.appendChild(el('p', { class: 'entry-sub' }, a.awarder));
    if (a.summary) entry.appendChild(el('p', { class: 'entry-desc' }, a.summary));
    return entry;
  });

  // Languages
  if (data.languages?.length) {
    root.appendChild(el('h2', {}, 'Languages'));
    const list = data.languages.map(l => `${l.language} — ${l.fluency}`).join(' · ');
    root.appendChild(el('p', { class: 'entry-sub' }, list));
  }

  // References
  section('References', data.references, r => {
    const entry = el('div', { class: 'entry' });
    entry.appendChild(el('h3', {}, r.name));
    if (r.reference) entry.appendChild(el('blockquote', {}, r.reference));
    return entry;
  });
})();
</script>
</body>
</html>
