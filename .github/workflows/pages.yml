name: Build and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 7,19 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      INSTAPAPER_PROFILE_URL: https://www.instapaper.com/p/snatalenko
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sync liked articles
        run: python3 scripts/sync_instapaper.py

      - name: Preserve new articles
        run: |
          if git diff --quiet -- _data/reading.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/reading.json
          git commit -m "Update reading list"
          git push

      - name: Generate sitemap timestamps
        run: |
          home_updated_at=$(git log -1 --format=%cI -- index.html reading.xml _data/reading.json _data/reading_notes.yml _config.yml _includes/site_header.html _includes/site_footer.html style.css)
          about_updated_at=$(git log -1 --format=%cI -- about/index.html _data/resume.json _config.yml _includes/site_header.html _includes/site_footer.html style.css)
          printf '{\n  "home_updated_at": "%s",\n  "about_updated_at": "%s"\n}\n' "$home_updated_at" "$about_updated_at" > _data/sitemap_meta.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
