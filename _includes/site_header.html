<header class="site-header">
  <nav class="site-nav" aria-label="Primary">
    <span class="site-nav-group">
      <a href="/"{% if include.current == "recommendations" %} aria-current="page"{% endif %}>Reading</a>
      <a href="/about/"{% if include.current == "about" %} aria-current="page"{% endif %}>About</a>
    </span>
    <span class="site-nav-group">
      <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme"><svg class="theme-toggle-icon theme-toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg><svg class="theme-toggle-icon theme-toggle-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
    </span>
  </nav>
</header>
<script>
(() => {
  const root = document.documentElement;
  const button = document.querySelector('.theme-toggle');
  const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
  if (!button) return;

  const currentTheme = () => root.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
  const updateLabel = () => {
    const nextTheme = currentTheme() === 'dark' ? 'light' : 'dark';
    const label = `Use ${nextTheme} theme`;
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
  };

  button.addEventListener('click', () => {
    const nextTheme = currentTheme() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = nextTheme;
    try { localStorage.setItem('color-theme', nextTheme); } catch (_) {}
    updateLabel();
  });

  systemTheme.addEventListener?.('change', () => {
    if (!root.dataset.theme) updateLabel();
  });
  updateLabel();
})();
</script>
